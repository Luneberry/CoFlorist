<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고양이 연결하기</title><style>html{margin:0;padding:0}body{font:17px sans-serif;margin:0;padding:0 12px;background:#fff9ee;color:#322e2a}h1{margin:0;padding:0;font-size:24px;line-height:1.25}label{display:block;margin:18px 0}input,button,select{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin-top:6px}button{background:#443c36;color:white;border:0;border-radius:8px}p{line-height:1.6}</style></head><body>
<h1>고양이 연결하기</h1><p>사용할 Wi-Fi를 입력해 주세요.<br>푸쉰 서버는 자동으로 연결됩니다.</p>
<form method="post" action="/api/provision" id="setup"><label>Wi-Fi 이름<input id="ssid" name="ssid" required maxlength="32" autocomplete="off"></label><div id="search" hidden><button type="button" id="scan">주변 Wi-Fi 찾기</button><select id="networks" hidden aria-label="검색한 Wi-Fi"><option value="">Wi-Fi 선택</option></select></div><label>Wi-Fi 비밀번호<input name="password" type="password" maxlength="64" autocomplete="off"></label><input id="time" name="time" type="hidden"><button type="submit">연결하기</button></form><p id="message" role="status">목록 검색 없이 이름을 직접 입력해도 연결할 수 있어요.</p><small>전원을 켤 때마다 새로 설정합니다.</small>
<script>
(function(){var form=document.getElementById('setup'),button=document.getElementById('scan'),list=document.getElementById('networks'),msg=document.getElementById('message');document.getElementById('search').hidden=false;
form.onsubmit=function(){document.getElementById('time').value=Math.floor(Date.now()/1000);};
list.onchange=function(){if(list.value)document.getElementById('ssid').value=list.value;};
button.onclick=function(){button.disabled=true;msg.textContent='Wi-Fi를 찾고 있어요. 최대 8초 걸립니다.';var xhr=new XMLHttpRequest();xhr.open('GET','/api/networks',true);xhr.timeout=8000;function fail(){button.disabled=false;msg.textContent='목록을 불러오지 못했어요. Wi-Fi 이름을 직접 입력해 연결해 주세요.';}
xhr.onerror=fail;xhr.ontimeout=fail;xhr.onload=function(){button.disabled=false;if(xhr.status!==200){fail();return;}try{var names=JSON.parse(xhr.responseText);list.options.length=1;for(var i=0;i<names.length;i++){list.add(new Option(names[i],names[i]));}list.hidden=names.length===0;msg.textContent=names.length?'목록에서 Wi-Fi를 고르거나 이름을 직접 입력해 주세요.':'검색 결과가 없어요. 이름을 직접 입력해 주세요.';}catch(e){fail();}};xhr.send();};})();
</script></body></html>
